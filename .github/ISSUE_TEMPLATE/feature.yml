name: Feature / work item
description: A planned unit of work — the backlog lives here, not in a file (conventions: IMPLEMENTATION-PLAN.md §1)
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        File one feature per issue. Assign it to a **Phase** milestone and a **track:** label.
        Link design/decision context (PRD/RFC/ADR) rather than restating it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is being built and the user value, in 1–3 sentences.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source / context
      description: Links to the PRD / RFC / ADR (in `.claude/planning/`) this traces back to.
      placeholder: "RFC-002 §FR-5..7, ADR-016"
    validations:
      required: false
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Backend (Dev A)
        - UI (Dev B)
        - Either
        - Joint
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - S (≤ ½ day)
        - M (½–2 days)
        - L (2–4 days)
        - XL (> 4 days — split if possible)
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must land first (GitHub will link them).
      placeholder: "#123, #131"
    validations:
      required: false
  - type: textarea
    id: touches
    attributes:
      label: Touched zones
      description: "Code areas, e.g. dom.ticketing, http.workflow, ui.lobby, schemas.ticketing, mig"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it's done (the Definition of Done for this item).
    validations:
      required: true
  - type: checkboxes
    id: contract-gate
    attributes:
      label: Contract gate (ADR-016)
      description: Required if this touches an HTTP endpoint, UI screen, or shared schema.
      options:
        - label: This item exposes/consumes an HTTP endpoint that already has a merged Mongoose contract (or doesn't touch HTTP/UI).
